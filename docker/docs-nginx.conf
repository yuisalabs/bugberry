# Installed as /etc/nginx/conf.d/default.conf in the docs image. Serves the static docs export under /docs;
# nothing else lives here (Caddy on the VPS sends every other path to the BugBerry app).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    error_page 404 /docs/404.html;

    location = /docs {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /docs/index.html =404;
    }

    # Hashed build output never changes under the same name.
    location ^~ /docs/_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pages are exported as /docs/<page>.html; a reload of /docs/self-host/install finds that file.
    location /docs/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /docs/404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }

    location / {
        return 404;
    }
}
