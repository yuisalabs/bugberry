# Installed as /etc/nginx/conf.d/default.conf in the client image. Serves the dashboard build and
# proxies /api to the api service of docker-compose.yml.

# Docker's embedded DNS. proxy_pass uses a variable, so "api" is resolved per request (cached 10 s):
# nginx starts while the api is still down (502 until it is up) and follows a recreated api's new IP.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # ^~ /api (not /api/) so a bare /api also reaches the api and gets its JSON 404.
    location ^~ /api {
        # Maintenance: while maintenance.json is in /etc/nginx/maintenance (./maintenance in docker-compose.yml),
        # every api request answers 503 with that notice and the dashboard shows its maintenance page. Deleting the
        # file ends it; nginx needs no reload. The api's own 503s still pass through (proxy_intercept_errors is off).
        if (-f /etc/nginx/maintenance/maintenance.json) {
            return 503;
        }
        error_page 503 /__maintenance.json;

        set $api_upstream http://api:3000;
        # No URI part: the original path and query are passed through unchanged.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Appends the address nginx received the request from; the api counts nginx as one hop
        # (PROXY_HOPS=1 in docker-compose.yml), so a value the client wrote is never trusted.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The api enforces MAX_UPLOAD_MB and the upload token's size; nginx streams local uploads to it
        # instead of answering 413 itself or spooling the whole file to its own disk first.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /__maintenance.json {
        internal;
        alias /etc/nginx/maintenance/maintenance.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # OAuth discovery for the MCP server (/api/mcp) has to sit at the site root; the api answers it.
    location ^~ /.well-known/oauth- {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/openid-configuration {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output never changes under the same name.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Any other file name (favicon, index.html): the file or a 404, never the app shell.
    location ~ "/[^/]+\.[^/]+$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Client-side routes (/r/<id>, /s/<slug>, /extension/connect) get the app shell, so a reload works.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
