# BugBerry for Dokploy: the api, MCP for AI agents, the dashboard and Postgres, from the published images.
# template.toml fills in the values; one sign-in method is required (the SMTP fields, or Google, GitHub, GitLab, OIDC).
services:
  api:
    image: ghcr.io/yuisalabs/bugberry-api:0.14.1
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://bugberry@postgres:5432/bugberry
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOCAL_STORAGE_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      PORT: "3000"
      PROXY_HOPS: "1"
      TRUST_PROXY: "true"
      SERVER_ROLE: app
      EMAIL_DRIVER: ${EMAIL_DRIVER-smtp}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      EXTENSION_ID: ${EXTENSION_ID:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      GITLAB_URL: ${GITLAB_URL:-}
      OIDC_NAME: ${OIDC_NAME:-}
      EMAIL_SIGN_IN: ${EMAIL_SIGN_IN:-}
      EXTENSION_INSTALL_URL: ${EXTENSION_INSTALL_URL:-}
      # S3, R2 or MinIO instead of the uploads volume: STORAGE_DRIVER=s3 and these.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_VIRTUAL_HOSTED_STYLE: ${S3_VIRTUAL_HOSTED_STYLE:-}
    volumes:
      - bugberry-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # MCP for AI agents in its own process; it waits for api to migrate the database.
  api-mcp:
    image: ghcr.io/yuisalabs/bugberry-api:0.14.1
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      APP_URL: ${APP_URL}
      DATABASE_URL: postgres://bugberry@postgres:5432/bugberry
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOCAL_STORAGE_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      PORT: "3000"
      PROXY_HOPS: "1"
      TRUST_PROXY: "true"
      SERVER_ROLE: mcp
      EMAIL_DRIVER: ${EMAIL_DRIVER-smtp}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      EXTENSION_ID: ${EXTENSION_ID:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      GITLAB_URL: ${GITLAB_URL:-}
      OIDC_NAME: ${OIDC_NAME:-}
      EMAIL_SIGN_IN: ${EMAIL_SIGN_IN:-}
      EXTENSION_INSTALL_URL: ${EXTENSION_INSTALL_URL:-}
      # S3, R2 or MinIO instead of the uploads volume: STORAGE_DRIVER=s3 and these.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_VIRTUAL_HOSTED_STYLE: ${S3_VIRTUAL_HOSTED_STYLE:-}
    volumes:
      - bugberry-uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy

  # The public address: the dashboard, with /api proxied to the api.
  client:
    image: ghcr.io/yuisalabs/bugberry-client:0.14.1
    restart: unless-stopped
    stop_grace_period: 60s
    expose:
      - "80"
    volumes:
      - bugberry-maintenance:/etc/nginx/maintenance:ro
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugberry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bugberry
    volumes:
      - bugberry-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugberry -d bugberry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bugberry-pgdata: {}
  bugberry-uploads: {}
  bugberry-maintenance: {}
