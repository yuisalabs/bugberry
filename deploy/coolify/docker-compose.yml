# documentation: https://bugberry.yuisalabs.com/docs/self-host/one-click
# slogan: Bug reports with video, console and network, for teams and the AI agents that fix them.
# category: development
# tags: bug,bug-report,screen-recording,qa,issue-tracker,mcp
# logo: svgs/bugberry.svg
# port: 80

# Coolify fills the SERVICE_* values (generated once, kept across deploys) and asks for every ${VAR:?}.
# One sign-in method is required: the email (SMTP) fields below, or Google, GitHub, GitLab or OIDC.
services:
  api:
    image: ghcr.io/yuisalabs/bugberry-api:0.14.1
    init: true
    stop_grace_period: 60s
    environment:
      APP_URL: ${SERVICE_URL_CLIENT}
      DATABASE_URL: postgres://bugberry@postgres:5432/bugberry
      DATABASE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      # Base64 of exactly 32 random bytes, the shape the server requires.
      ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_ENCRYPTION}
      LOCAL_STORAGE_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      PORT: "3000"
      PROXY_HOPS: "1"
      TRUST_PROXY: "true"
      SERVER_ROLE: app
      EMAIL_DRIVER: ${EMAIL_DRIVER-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      EXTENSION_ID: ${EXTENSION_ID:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      GITLAB_URL: ${GITLAB_URL:-}
      OIDC_NAME: ${OIDC_NAME:-}
      EMAIL_SIGN_IN: ${EMAIL_SIGN_IN:-}
      EXTENSION_INSTALL_URL: ${EXTENSION_INSTALL_URL:-}
      # S3, R2 or MinIO instead of the uploads volume: STORAGE_DRIVER=s3 and these.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_VIRTUAL_HOSTED_STYLE: ${S3_VIRTUAL_HOSTED_STYLE:-}
    volumes:
      - bugberry-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # MCP for AI agents in its own process; it waits for api to migrate the database.
  api-mcp:
    image: ghcr.io/yuisalabs/bugberry-api:0.14.1
    init: true
    stop_grace_period: 60s
    environment:
      APP_URL: ${SERVICE_URL_CLIENT}
      DATABASE_URL: postgres://bugberry@postgres:5432/bugberry
      DATABASE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_ENCRYPTION}
      LOCAL_STORAGE_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      PORT: "3000"
      PROXY_HOPS: "1"
      TRUST_PROXY: "true"
      SERVER_ROLE: mcp
      EMAIL_DRIVER: ${EMAIL_DRIVER-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      EXTENSION_ID: ${EXTENSION_ID:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      GITLAB_URL: ${GITLAB_URL:-}
      OIDC_NAME: ${OIDC_NAME:-}
      EMAIL_SIGN_IN: ${EMAIL_SIGN_IN:-}
      EXTENSION_INSTALL_URL: ${EXTENSION_INSTALL_URL:-}
      # S3, R2 or MinIO instead of the uploads volume: STORAGE_DRIVER=s3 and these.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_VIRTUAL_HOSTED_STYLE: ${S3_VIRTUAL_HOSTED_STYLE:-}
    volumes:
      - bugberry-uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy

  # The public address: the dashboard, with /api proxied to the api.
  client:
    image: ghcr.io/yuisalabs/bugberry-client:0.14.1
    stop_grace_period: 60s
    environment:
      - SERVICE_URL_CLIENT_80
    volumes:
      - bugberry-maintenance:/etc/nginx/maintenance:ro
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bugberry
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: bugberry
    volumes:
      - bugberry-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugberry -d bugberry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bugberry-pgdata: {}
  bugberry-uploads: {}
  bugberry-maintenance: {}
